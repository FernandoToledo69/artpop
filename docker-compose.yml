services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artpop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - artpop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artpop"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation-service:
    build:
      context: ./backend
    command: ["npm", "run", "start:recommendations"]
    environment:
      RECOMMENDATION_HOST: 0.0.0.0
      RECOMMENDATION_PORT: 3334
    ports:
      - "3334:3334"

  backend:
    build:
      context: ./backend
    command: ["sh", "-c", "npm run prisma:deploy && npm run start"]
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/artpop?schema=public
      JWT_SECRET: development-docker-secret
      CORS_ORIGIN: http://localhost:3000
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3334
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      recommendation-service:
        condition: service_started

volumes:
  artpop-postgres:
